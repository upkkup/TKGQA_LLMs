name: Template KGQA tests

on:
  pull_request:
    paths:
      - "template_based_kgqa/**"
      - ".github/workflows/template-kgqa-tests.yml"
  push:
    branches:
      - "feature/template-based-kgqa"
    paths:
      - "template_based_kgqa/**"
      - ".github/workflows/template-kgqa-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "rdflib>=7.0"
      - run: python -m unittest discover -s template_based_kgqa/tests -v
        env:
          PYTHONPATH: template_based_kgqa/src
